<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- nordstern: Nachtschwarze Kachel, der Stern in der Mitte. Derselbe Stern
       wie in js/ui/header.js (Korona, Spitzen, Bloom, Kern), nur kräftiger,
       damit er bei 16 px noch ein Stern ist. -->
  <defs>
    <radialGradient id="sky" cx="0.62" cy="-0.1" r="1.1">
      <stop offset="0" stop-color="#3987e5" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#3987e5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corona">
      <stop offset="0" stop-color="#f2f8ff" stop-opacity="0.55"/>
      <stop offset="0.22" stop-color="#bcd9ff" stop-opacity="0.26"/>
      <stop offset="0.52" stop-color="#6fb0f0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.34" stop-color="#eaf4ff" stop-opacity="0.78"/>
      <stop offset="0.68" stop-color="#a9cdf7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7fb2e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spike" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="36">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.16" stop-color="#e8f3ff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#a8ccf5" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7fb2e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#04070e"/>
  <rect width="100" height="100" rx="22" fill="url(#sky)"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="21.5" fill="none" stroke="#e9eff9" stroke-opacity="0.07"/>
  <circle cx="50" cy="50" r="36" fill="url(#corona)"/>
  <g fill="url(#spike)">
    <path d="M50 15 L53.6 50 L50 85 L46.4 50 Z"/>
    <path d="M50 15 L53.6 50 L50 85 L46.4 50 Z" transform="rotate(90 50 50)"/>
    <path d="M50 30 L52.3 50 L50 70 L47.7 50 Z" transform="rotate(45 50 50)" opacity="0.55"/>
    <path d="M50 30 L52.3 50 L50 70 L47.7 50 Z" transform="rotate(-45 50 50)" opacity="0.55"/>
  </g>
  <circle cx="50" cy="50" r="12" fill="url(#bloom)"/>
  <circle cx="50" cy="50" r="3.4" fill="#ffffff"/>
</svg>
