# Pages serves the single-file build — the same file you would download and
# open from your own disk, so hosted and offline copy cannot drift apart —
# plus the example workbook and the icon file beside it. The build is done
# here rather than committed: a generated megabyte in the history goes stale
# without anyone noticing.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Nothing is published that has not passed; tests/build.mjs fails if the
      # file is not self-contained.
      - run: npm test

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp export/nordstern.html _site/index.html
          cp examples/nordstern-example.xlsx _site/
          # Safari loads no data: favicons, so the icon is served as a file
          # beside the page.
          cp favicon.png _site/
          touch _site/.nojekyll
          # The page must carry the policy that forbids any outbound request.
          grep -q "connect-src 'none'" _site/index.html \
            || { echo "::error::the published page is missing its Content-Security-Policy"; exit 1; }

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
