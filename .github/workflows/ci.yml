# The whole suite on every push and pull request. tests/privacy.mjs also
# runs: its needle scan against a real workbook cannot say anything here,
# since there is none on a runner, but its image and person checks need no
# workbook and run below.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

      - name: "Privacy guard: images and names"
        run: node tests/privacy.mjs

      - name: No spreadsheet may enter the repository
        # A second lock beside .gitignore, for tracked files.
        run: |
          bad=$(git ls-files | grep -Ei '\.(xlsx|xlsm|xlsb|xls|ods|numbers|csv)$' | grep -v '^examples/' || true)
          if [ -n "$bad" ]; then echo "::error::tracked spreadsheet outside examples/: $bad"; exit 1; fi
